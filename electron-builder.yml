appId: so.argo.chewo
productName: Chewo
directories:
  buildResources: build
  output: dist
files:
  - out/**
# Audio-capture sidecar: `predist` builds it, this drops the executable at
# Resources/bin/chewo-audio-capture — where sidecarPath() looks when packaged.
#
# MCP server: `build:mcp` bundles it, this drops it at Resources/bin/chewo-mcp.cjs
# — where mcpScriptPath() looks. The CLIs run it via the app's own binary with
# ELECTRON_RUN_AS_NODE=1, so a user needs no Node install and nothing separate.
extraResources:
  - from: packages/audio-capture/.build/release/chewo-audio-capture
    to: bin/chewo-audio-capture
  - from: packages/chewo-mcp/dist/index.cjs
    to: bin/chewo-mcp.cjs
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: false
mac:
  target:
    - dir
  # TCC usage strings — mic for dictation, system audio for the notes
  # device+mic (meeting/online lesson) capture. TCC may attribute the
  # sidecar's capture to the parent app, so the app must carry them too.
  extendInfo:
    NSMicrophoneUsageDescription: Chewo records your dictation and sends the audio to Deepgram, which transcribes it into your notes.
    NSAudioCaptureUsageDescription: Chewo records computer audio and sends it to Deepgram, which transcribes online lessons and meetings into your notes.
  # Local dogfood builds: skip keychain identity (duplicated cert makes it
  # ambiguous); ad-hoc signature is enough for an app built on this machine.
  identity: null
